<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>FoodHub — Login</title>
<script>try{var t=localStorage.getItem('fh_theme')||'light';document.documentElement.setAttribute('data-theme',t);if(t==='dark')document.documentElement.classList.add('dark');}catch(e){}</script>
<script src="https://cdn.tailwindcss.com"></script>
<script>
  tailwind.config = {
    darkMode: 'class',
    theme: { extend: {
      colors: { brand: { 500:'#f97316', 600:'#ea580c', 700:'#c2410c' } },
      fontFamily: { display: ['Poppins','sans-serif'], body: ['Inter','sans-serif'] }
    } }
  };
</script>
<link rel="stylesheet" href="css/style.css">
</head>
<body class="font-body">

<div id="navbar" class="sticky top-0 z-30 surface" style="box-shadow:var(--shadow)"></div>

<main class="max-w-md mx-auto px-4 py-12">
  <div class="surface rounded-2xl p-8" style="box-shadow:var(--shadow)">
    <div class="text-center mb-6">
      <div class="w-14 h-14 rounded-2xl mx-auto flex items-center justify-center text-3xl text-white mb-3" style="background:var(--brand)">🍔</div>
      <h1 class="font-display font-bold text-2xl">Welcome back!</h1>
      <p class="text-sm text-muted mt-1">Log in to order your favorites.</p>
    </div>
    <div class="space-y-3">
      <input id="email" type="email" class="input" placeholder="Email address" autocomplete="email">
      <input id="password" type="password" class="input" placeholder="Password" autocomplete="current-password">
      <p id="err" class="text-sm hidden" style="color:var(--danger)"></p>
      <button id="btn" class="btn-brand w-full" onclick="doLogin()">Login</button>
    </div>
    <p class="text-sm text-muted text-center mt-5">
      New here? <a href="signup.html" class="font-semibold" style="color:var(--brand-dark)">Create an account</a>
    </p>
  </div>
</main>

<script src="js/api.js"></script>
<script src="js/auth.js"></script>
<script src="js/common.js"></script>
<script>
/** POST /api/auth/login -> store JWT + user -> go back where the user came from */
async function doLogin() {
  const email = document.getElementById("email").value.trim();
  const password = document.getElementById("password").value;
  const err = document.getElementById("err");
  const btn = document.getElementById("btn");
  err.classList.add("hidden");

  if (!email || !password) {
    err.textContent = "Enter your email and password.";
    err.classList.remove("hidden");
    return;
  }
  btn.disabled = true;
  btn.textContent = "Logging in…";
  try {
    const user = await login(email, password);
    toast("Welcome back! 👋", "success");
    // ?next= wins; otherwise route by role so partners, admins and riders
    // land on their own dashboards instead of the customer homepage.
    const next = getParam("next");
    if (next) location.href = next;
    else if (user.role === "admin") location.href = "admin.html";
    else if (user.role === "restaurant") location.href = "partner.html";
    else if (user.role === "delivery") location.href = "rider.html";
    else location.href = "index.html";
  } catch (e) {
    err.textContent = e.message;
    err.classList.remove("hidden");
    btn.disabled = false;
    btn.textContent = "Login";
  }
}

// Enter key submits the form
document.addEventListener("keydown", e => { if (e.key === "Enter") doLogin(); });

initCommon();
</script>
</body>
</html>
