<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>FoodHub — Track Order</title>
<script>try{var t=localStorage.getItem('fh_theme')||'light';document.documentElement.setAttribute('data-theme',t);if(t==='dark')document.documentElement.classList.add('dark');}catch(e){}</script>
<script src="https://cdn.tailwindcss.com"></script>
<script>
  tailwind.config = {
    darkMode: 'class',
    theme: { extend: {
      colors: { brand: { 500:'#f97316', 600:'#ea580c', 700:'#c2410c' } },
      fontFamily: { display: ['Poppins','sans-serif'], body: ['Inter','sans-serif'] }
    } }
  };
</script>
<link rel="stylesheet" href="css/style.css">
</head>
<body class="font-body">

<div id="navbar" class="sticky top-0 z-30 surface" style="box-shadow:var(--shadow)"></div>

<main class="max-w-2xl mx-auto px-4 py-6">
  <h1 class="font-display font-bold text-2xl mb-1">Track your order</h1>
  <p id="order-id" class="text-sm text-muted mb-6"></p>

  <div id="content"></div>
</main>

<script src="js/api.js"></script>
<script src="js/auth.js"></script>
<script src="js/common.js"></script>
<script src="https://cdn.socket.io/4.7.5/socket.io.min.js"></script>
<script>
requireAuth();

const OID = getParam("id");
let timer = null;

/* The 4 tracking stages. Backend status strings are normalized to these keys. */
const STEPS = [
  { key: "placed",     label: "Order placed",  icon: "🧾" },
  { key: "preparing",  label: "Preparing",     icon: "👨‍🍳" },
  { key: "on_the_way", label: "On the way",    icon: "🛵" },
  { key: "delivered",  label: "Delivered",     icon: "📦" },
];

// Live ETA state (rider tracking)
let etaState = { lat: null, lng: null, arrived: false, pickedUp: false };

/** "On the way" / "on-the-way" / "On The Way" -> "on_the_way" */
function normStatus(s) {
  return String(s || "").toLowerCase().trim().replace(/[\s-]+/g, "_");
}

function fmtTime(t) {
  if (!t) return "";
  return new Date(t).toLocaleTimeString("en-IN", { hour: "numeric", minute: "2-digit" });
}

async function load() {
  const wrap = document.getElementById("content");
  try {
    const data = await apiFetch("/orders/" + OID, { auth: true });
    const o = data.order || data;
    render(o);
  } catch (e) {
    clearInterval(timer);
    wrap.innerHTML = `<div class="text-center py-20 text-muted"><div class="text-5xl mb-3">⚠️</div><p>${esc(e.message)}</p></div>`;
  }
}

function render(o) {
  window.__order = o; // store for ETA updates
  // Restore rider tracking state from order data
  if (o.riderLat && o.riderLng) {
    etaState.lat = o.riderLat;
    etaState.lng = o.riderLng;
  }
  if (o.arrivedAt) etaState.arrived = true;
  if (o.pickedUpAt) etaState.pickedUp = true;
  document.getElementById("order-id").textContent = "Order #" + String(o._id || o.id).slice(-8).toUpperCase();
  const wrap = document.getElementById("content");
  const status = normStatus(o.status);
  const history = o.statusHistory || o.timeline || {};   // optional per-stage timestamps

  if (status === "cancelled") {
    wrap.innerHTML = `<div class="surface rounded-2xl p-8 text-center">
      <div class="text-5xl mb-3">❌</div>
      <h2 class="font-display font-bold text-xl mb-2">Order cancelled</h2>
      <p class="text-muted text-sm">This order was cancelled. Your money (if paid) will be refunded.</p>
      <a href="index.html" class="btn-brand inline-block mt-5">Order Again</a></div>`;
    clearInterval(timer);
    return;
  }

  const currentIdx = Math.max(0, STEPS.findIndex(s => s.key === status));

  const timeline = STEPS.map((s, i) => {
    const cls = i < currentIdx ? "done" : (i === currentIdx ? "active" : "");
    const ts = history[s.key] || (s.key === "placed" ? o.createdAt : null);
    let sub;
    if (ts) {
      sub = fmtTime(ts);
    } else if (i < currentIdx) {
      // Done steps: show meaningful label
      if (s.key === "preparing") sub = "Prepared";
      else if (s.key === "on_the_way") sub = "Delivered";
      else sub = "";
    } else if (i === currentIdx) {
      if (s.key === "delivered") sub = "Delivered";
      else if (s.key === "on_the_way") sub = "Picked up";
      else sub = "In progress…";
    } else {
      sub = "Pending";
    }
    // Rider assignment info just above "On the way"
    let extra = "";
    if (s.key === "on_the_way" && o.assignedRider && i <= currentIdx) {
      extra = `<p class="text-xs font-semibold" style="color:var(--brand)">🛵 Assigned to ${esc(o.assignedRider.name)}</p>`;
    }
    return `<div class="timeline-step ${cls}">
      <div class="timeline-dot">${i < currentIdx ? "✓" : s.icon}</div>
      <p class="font-semibold">${s.label}</p>
      ${extra}
      <p class="text-xs text-muted">${sub}</p>
    </div>`;
  }).join("");

  const items = (o.items || []).map(i =>
    `<div class="flex justify-between text-sm"><span class="text-muted">${esc(i.name || "Item")} × ${i.qty}</span><span>${i.price ? inr(i.price * i.qty) : ""}</span></div>`
  ).join("");

  const restName = o.restaurantName || (o.restaurant && o.restaurant.name) || "";

  const riderBox = o.assignedRider ? `
    <div class="surface rounded-2xl p-4 mb-5 flex items-center gap-3" style="box-shadow:var(--shadow)">
      <div class="w-11 h-11 rounded-xl flex items-center justify-center text-2xl shrink-0" style="background:#ffedd5">🛵</div>
      <div>
        <p class="font-semibold text-sm">Your delivery partner: ${esc(o.assignedRider.name)}</p>
        <p class="text-xs text-muted font-mono">📞 ${esc(o.assignedRider.phone || "")}</p>
      </div>
    </div>` : "";

  wrap.innerHTML = `
    <div class="surface rounded-2xl p-6 mb-5" style="box-shadow:var(--shadow)">
      <div class="flex items-center justify-between mb-5">
        <div><p class="font-display font-semibold text-lg">${esc(restName)}</p>
        <p class="text-sm text-muted">${inr(o.total ?? o.totalAmount ?? 0)} • ${esc(o.paymentMethod || "")}</p></div>
        ${status === "placed" ? `<button class="text-sm font-medium px-4 py-2 rounded-xl surface hover:opacity-80" style="color:var(--danger)" onclick="cancelOrder()">Cancel order</button>` : ""}
      </div>
      ${timeline}
    </div>
    <div id="eta-box" class="hidden surface rounded-2xl p-4 mb-5 text-center" style="box-shadow:var(--shadow);border:2px solid var(--brand)"></div>
    ${riderBox}
    <div class="surface rounded-2xl p-6" style="box-shadow:var(--shadow)">
      <h3 class="font-display font-semibold mb-3">Items</h3>
      <div class="space-y-2">${items || '<p class="text-sm text-muted">No item details.</p>'}</div>
      <p class="text-sm text-muted mt-4">📍 Delivering to: ${esc(formatAddress(o.address))}</p>
    </div>
    <p class="text-xs text-muted text-center mt-4">Auto-refreshes every 10 seconds</p>`;

  // stop polling once delivered
  if (status === "delivered") clearInterval(timer);

  // Update live ETA box
  renderEta();
}

function formatAddress(a) {
  if (!a) return "—";
  if (typeof a === "string") return a;
  return [a.street, a.city, a.pincode].filter(Boolean).join(", ");
}

/** Cancel is only offered while the order is still "placed".
    Note: the backend restricts PATCH /orders/:id/status to admins,
    so a customer sees a friendly message instead of a raw error. */
async function cancelOrder() {
  if (!confirm("Cancel this order?")) return;
  try {
    await apiFetch("/orders/" + OID + "/cancel", { method: "PATCH", auth: true });
    toast("Order cancelled.", "success");
    load();
  } catch (e) {
    toast(e.message, "error");
  }
}

initCommon();
if (!OID) {
  location.href = "orders.html";
} else {
  document.getElementById("content").innerHTML = skeletonLines(5);
  load();
  timer = setInterval(load, 10000);   // fallback polling: refresh every 10s
  // Real-time: the server pushes status changes instantly over websocket.
  // If the socket fails, the 10s polling above keeps tracking working.
  try {
    const socket = io(API_ORIGIN, { transports: ["websocket", "polling"] });
    socket.on("connect", () => socket.emit("join-order", OID));
    socket.on("order-status", (data) => {
      if (data && data.status) {
        load();                       // re-fetch + re-render with the new status
        toast("Order update: " + data.status.replace(/_/g, " "), "success");
      }
    });
    // Live rider location → update ETA timer
    socket.on("rider-location", (data) => {
      if (data) updateEta(data);
    });
  } catch (e) { /* websocket unavailable — polling covers it */ }
}

// ---------- Live ETA ----------
function haversine(lat1, lon1, lat2, lon2) {
  const R = 6371;
  const dLat = (lat2 - lat1) * Math.PI / 180;
  const dLon = (lon2 - lon1) * Math.PI / 180;
  const a = Math.sin(dLat / 2) ** 2 +
    Math.cos(lat1 * Math.PI / 180) * Math.cos(lat2 * Math.PI / 180) *
    Math.sin(dLon / 2) ** 2;
  return 2 * R * Math.asin(Math.sqrt(a));
}

function updateEta(data) {
  if (data.lat && data.lng) {
    etaState.lat = data.lat;
    etaState.lng = data.lng;
  }
  if (data.arrived) etaState.arrived = true;
  if (data.pickedUp) etaState.pickedUp = true;
  renderEta();
}

function renderEta() {
  const el = document.getElementById("eta-box");
  if (!el) return;
  const o = window.__order;
  if (!o || o.status !== "on_the_way") {
    el.classList.add("hidden");
    return;
  }
  el.classList.remove("hidden");
  let html = "";
  // Picked up state (with time)
  if (o.pickedUpAt || etaState.pickedUp) {
    const t = o.pickedUpAt ? fmtTime(o.pickedUpAt) : "";
    html += `<p class="text-sm font-semibold" style="color:var(--brand)">📦 Picked up${t ? " · " + t : ""}</p>`;
  }
  // ETA / Arrived (with time)
  if (etaState.arrived || o.arrivedAt) {
    const t = o.arrivedAt ? fmtTime(o.arrivedAt) : "";
    html += `<p class="font-display font-bold text-lg">🎉 Arrived!${t ? " · " + t : ""}</p>`;
    html += `<p class="text-sm text-muted">Your rider is at your location.</p>`;
  } else if (etaState.lat && o.deliveryLat && o.deliveryLng) {
    const distKm = haversine(etaState.lat, etaState.lng, o.deliveryLat, o.deliveryLng);
    const etaMin = Math.max(1, Math.round(distKm / 0.4)); // ~24 km/h avg city speed
    html += `<p class="font-display font-bold text-lg">⏱ Arriving in ~${etaMin} min</p>`;
    html += `<p class="text-sm text-muted">${distKm.toFixed(1)} km away</p>`;
  } else if (o.assignedRider) {
    html += `<p class="text-sm text-muted">🛵 ${esc(o.assignedRider.name)} is on the way…</p>`;
  }
  el.innerHTML = html;
}
</script>
</body>
</html>
