<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>FoodHub — Your Cart</title>
<script>try{var t=localStorage.getItem('fh_theme')||'light';document.documentElement.setAttribute('data-theme',t);if(t==='dark')document.documentElement.classList.add('dark');}catch(e){}</script>
<script src="https://cdn.tailwindcss.com"></script>
<script>
  tailwind.config = {
    darkMode: 'class',
    theme: { extend: {
      colors: { brand: { 500:'#f97316', 600:'#ea580c', 700:'#c2410c' } },
      fontFamily: { display: ['Poppins','sans-serif'], body: ['Inter','sans-serif'] }
    } }
  };
</script>
<link rel="stylesheet" href="css/style.css">
</head>
<body class="font-body">

<div id="navbar" class="sticky top-0 z-30 surface" style="box-shadow:var(--shadow)"></div>

<main class="max-w-3xl mx-auto px-4 py-6">
  <h1 class="font-display font-bold text-2xl mb-1">Your Cart</h1>
  <p id="rest-name" class="text-sm text-muted mb-5"></p>

  <div id="items" class="space-y-3 mb-6"></div>

  <!-- Coupon -->
  <div class="surface rounded-2xl p-4 mb-6" style="box-shadow:var(--shadow)">
    <h3 class="font-display font-semibold mb-2">Have a coupon?</h3>
    <div class="flex gap-2">
      <input id="coupon" type="text" placeholder="e.g. WELCOME50" class="input uppercase" autocomplete="off">
      <button class="btn-brand whitespace-nowrap" onclick="applyCoupon()">Apply</button>
    </div>
    <p id="coupon-msg" class="text-sm mt-2"></p>
  </div>

  <!-- Bill -->
  <div class="surface rounded-2xl p-5" style="box-shadow:var(--shadow)">
    <h3 class="font-display font-semibold mb-3">Bill Details</h3>
    <div id="bill" class="space-y-2 text-sm"></div>
    <button class="btn-brand w-full mt-5" onclick="goCheckout()">Proceed to Checkout →</button>
    <button class="w-full mt-2 text-sm text-muted hover:opacity-70" onclick="clearCart()">Clear cart</button>
  </div>
</main>

<script src="js/api.js"></script>
<script src="js/auth.js"></script>
<script src="js/common.js"></script>
<script>
let RESTAURANT = null;      // for delivery fee
let coupon = null;          // { code, discount } after validation
try { coupon = JSON.parse(localStorage.getItem("fh_coupon")) || null; } catch (e) { coupon = null; }

/** Load restaurant (for its delivery fee), then render the cart */
async function init() {
  const c = Cart.get();
  if (!c || Object.keys(c.items).length === 0) {
    document.getElementById("items").innerHTML =
      `<div class="text-center py-20 text-muted"><div class="text-6xl mb-4">🛒</div>
       <p class="mb-4">Your cart is empty.</p>
       <a href="index.html" class="btn-brand inline-block">Browse Restaurants</a></div>`;
    document.querySelectorAll("main > div.surface, main > button").forEach(el => {
      if (el.id !== "items") el.style.display = "none";
    });
    return;
  }
  try {
    const data = await apiFetch("/restaurants/" + c.restaurantId);
    RESTAURANT = data.restaurant || data;
    document.getElementById("rest-name").textContent = "From " + (RESTAURANT.name || "");
  } catch (e) { /* fee falls back to flat rate below */ }
  if (coupon) document.getElementById("coupon").value = coupon.code;
  render();
}

function render() {
  const c = Cart.get();
  const wrap = document.getElementById("items");
  const items = Object.values(c.items);

  wrap.innerHTML = items.map(i => `
    <div class="surface rounded-2xl p-3 flex gap-4 items-center">
      ${i.image ? `<img src="${esc(imgUrl(i.image))}" onerror="imgFallback(this)" class="w-20 h-20 rounded-xl object-cover flex-shrink-0" alt="">`
                : `<div class="w-20 h-20 rounded-xl img-fallback flex-shrink-0 !text-2xl">🍽️</div>`}
      <div class="flex-1 min-w-0">
        <div class="flex items-center gap-2">
          <span class="veg-mark ${i.veg ? "" : "nonveg"}"></span>
          <p class="font-semibold truncate">${esc(i.name)}</p>
        </div>
        <p class="font-bold mt-1" style="color:var(--brand-dark)">${inr(i.price)}</p>
      </div>
      <div class="flex items-center gap-2">
        <span class="stepper-btn" onclick="chQty('${i._id}', ${i.qty - 1})">−</span>
        <span class="font-bold w-5 text-center">${i.qty}</span>
        ${i.qty >= MAX_QTY_PER_ITEM ? "" : `<span class="stepper-btn" onclick="chQty('${i._id}', ${i.qty + 1})">+</span>`}
      </div>
    </div>`).join("");

  // Re-validate stored coupon if cart changed (discount may no longer apply)
  renderBill();
}

function chQty(id, qty) {
  Cart.setQty(id, qty);
  const c = Cart.get();
  if (!c) { location.reload(); return; }  // cart emptied
  render();
}

/** Validate coupon via GET /api/coupons/validate?code=&subtotal=
    Backend returns { valid: true, discount, freeDelivery }
    or { valid: false, message } — both with HTTP 200. */
async function applyCoupon() {
  const code = document.getElementById("coupon").value.trim().toUpperCase();
  const msg = document.getElementById("coupon-msg");
  if (!code) return toast("Enter a coupon code first.", "error");
  msg.textContent = "Checking…";
  msg.style.color = "var(--muted)";
  try {
    const data = await apiFetch("/coupons/validate" + qs({ code, subtotal: Cart.subtotal() }));
    if (!data.valid) throw new Error(data.message || "Invalid coupon.");
    coupon = { code, discount: Number(data.discount) || 0, freeDelivery: !!data.freeDelivery };
    localStorage.setItem("fh_coupon", JSON.stringify(coupon));
    msg.textContent = "✓ " + code + " applied — you save " + inr(coupon.discount)
      + (coupon.freeDelivery ? " + FREE delivery!" : "");
    msg.style.color = "var(--success)";
    renderBill();
  } catch (e) {
    coupon = null;
    localStorage.removeItem("fh_coupon");
    msg.textContent = "✕ " + e.message;
    msg.style.color = "var(--danger)";
    renderBill();
  }
}

function renderBill() {
  const subtotal = Cart.subtotal();
  const discount = coupon ? Math.min(coupon.discount, subtotal) : 0;
  // FREEDEL-style coupons waive the delivery fee
  let fee = RESTAURANT && RESTAURANT.deliveryFee != null ? Number(RESTAURANT.deliveryFee) : 30;
  if (coupon && coupon.freeDelivery) fee = 0;
  const total = Math.max(0, subtotal - discount + fee);

  document.getElementById("bill").innerHTML = `
    <div class="flex justify-between"><span class="text-muted">Subtotal</span><span>${inr(subtotal)}</span></div>
    <div class="flex justify-between"><span class="text-muted">Discount${coupon ? " (" + esc(coupon.code) + ")" : ""}</span>
      <span style="color:var(--success)">− ${inr(discount)}</span></div>
    <div class="flex justify-between"><span class="text-muted">Delivery fee</span><span>${fee === 0 ? "Free" : inr(fee)}</span></div>
    <div class="flex justify-between font-display font-bold text-lg pt-2 border-t" style="border-color:var(--border)">
      <span>To Pay</span><span>${inr(total)}</span></div>`;

  // expose totals for checkout page
  window.__bill = { subtotal, discount, fee, total };
}

function clearCart() {
  if (confirm("Remove everything from the cart?")) {
    Cart.clear();
    localStorage.removeItem("fh_coupon");
    location.reload();
  }
}

function goCheckout() {
  requireAuth();              // bounce to login if needed
  location.href = "checkout.html";
}

initCommon();
init();
</script>
</body>
</html>
